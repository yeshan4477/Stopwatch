<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flipbook Style Stopwatch</title>
  <style>
    body {
      background-color: #e0f0ff;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .stopwatch-container {
      display: flex;
      gap: 10px;
    }
    .time-box {
      background: #0077cc;
      color: white;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.2);
      text-align: center;
      font-size: 48px;
      letter-spacing: 2px;
      user-select: none;
      min-width: 100px;
      transform-origin: top;
      transition: transform 0.4s ease-in-out;
    }
    .flip {
      transform: rotateX(-90deg);
    }
    .hint {
      font-size: 16px;
      color: #333333;
      text-align: center;
      position: absolute;
      top: 20px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="hint">Press SPACE to Start/Stop, ENTER to Reset</div>
  <div class="stopwatch-container">
    <div class="time-box" id="hours">00</div>
    <div class="time-box" id="minutes">00</div>
    <div class="time-box" id="seconds">00</div>
    <div class="time-box" id="milliseconds">00</div>
  </div>

  <script>
    let startTime = 0;
    let elapsed = 0;
    let timerInterval = null;
    let isRunning = false;

    const hourBox = document.getElementById('hours');
    const minuteBox = document.getElementById('minutes');
    const secondBox = document.getElementById('seconds');
    const msBox = document.getElementById('milliseconds');

    function applyFlip(el, newText) {
      if (el.textContent !== newText) {
        el.classList.add('flip');
        setTimeout(() => {
          el.textContent = newText;
          el.classList.remove('flip');
        }, 200);
      }
    }

    function updateDisplay(time) {
      const date = new Date(time);
      const hours = String(date.getUTCHours()).padStart(2, '0');
      const minutes = String(date.getUTCMinutes()).padStart(2, '0');
      const seconds = String(date.getUTCSeconds()).padStart(2, '0');
      const milliseconds = String(Math.floor(date.getUTCMilliseconds() / 10)).padStart(2, '0');

      applyFlip(hourBox, hours);
      applyFlip(minuteBox, minutes);
      applyFlip(secondBox, seconds);
      applyFlip(msBox, milliseconds);
    }

    function startStopwatch() {
      startTime = Date.now() - elapsed;
      timerInterval = setInterval(() => {
        elapsed = Date.now() - startTime;
        updateDisplay(elapsed);
      }, 10);
      isRunning = true;
    }

    function stopStopwatch() {
      clearInterval(timerInterval);
      isRunning = false;
    }

    function resetStopwatch() {
      stopStopwatch();
      elapsed = 0;
      updateDisplay(0);
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        isRunning ? stopStopwatch() : startStopwatch();
      } else if (e.code === 'Enter') {
        resetStopwatch();
      }
    });
  </script>
</body>
</html>
